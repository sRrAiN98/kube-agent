# ==============================================================================
# kube-agent 팀 공용 설정 파일 (Template)
#
# 복사하여 kube-agent.yaml 또는 ~/.kube-agent.yaml 로 저장하여 사용하세요.
# 우선순위: CLI Flag > 환경 변수 > 본 설정 파일 > 기본값
# ==============================================================================

# 1. LLM 연결 설정 (OpenAI 호환 API: vLLM, LiteLLM, Ollama, OpenAI)
llm:
  url: "http://litellm.litellm.svc.cluster.local:4000/v1"  # 또는 https://api.openai.com/v1
  model: "gpt-4o"                                          # Qwen/Qwen2.5-Coder-32B-Instruct 등
  api_key: ""                                             # 필요 시 토큰 입력 (또는 OPENAI_API_KEY 환경변수)

# 2. Kubernetes 클러스터 설정
# 로컬 실행 시 비워두면 ~/.kube/config 의 현재 활성 Context & Namespace를 자동 감지합니다.
kubernetes:
  context: ""                                              # 특정 컨텍스트 강제 지정 (선택)
  namespace: ""                                            # 작업 네임스페이스 (비워두면 자동 감지)

# 3. Gitea / Git 연동 설정
gitea:
  url: "http://gitea.gitea.svc.cluster.local:3000"
  token: ""                                                # Gitea API Access Token
  timeout: 30.0

# 4. 관측성 (Observability) 연동 설정
# Prometheus PromQL 쿼리 및 Grafana Loki LogQL 분산 로그 분석 지원
observability:
  prometheus_url: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
  loki_url: "http://loki-gateway.logging.svc.cluster.local:3100"

# 5. 안전 가드레일 (Safety Guardrails)
# mode: strict (기본값, 변경/삭제 시 사용자 승인 필요) | permissive | disabled | read_only
safety:
  mode: "strict"

# 읽기 전용 모드 (모든 리소스 생성, 수정, 삭제, Pod 재시작 등 차단)
read_only: false

# 6. 기타 튜닝 옵션
verbose: false
max_messages: 80
max_tool_iterations: 30
max_auto_continue: 5
tool_result_max_chars: 3000
